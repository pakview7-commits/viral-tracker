<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amir Malik viral niches</title>
<style>
  :root{
    --bg:#0b0b10; --card:#14141c; --card2:#1a1a24; --line:#262633;
    --pink:#ff2d78; --pink2:#ff5c9d; --cyan:#22d3ee; --purple:#a855f7;
    --txt:#f1f1f5; --mut:#9a9aad;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--txt); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; min-height:100vh}
  header{display:flex; align-items:center; gap:14px; padding:16px 28px; border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(11,11,16,.95); backdrop-filter:blur(8px); z-index:10; flex-wrap:wrap}
  .logo{display:flex; align-items:center; gap:10px; font-size:22px; font-weight:800}
  .logo .flame{background:linear-gradient(135deg,#ff2d78,#ff8a3d); width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px}
  .spacer{flex:1}
  .chip{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 14px; font-size:14px; display:flex; align-items:center; gap:8px; color:var(--txt)}
  .chip b{color:var(--pink2)}
  .iconbtn{background:var(--card); border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:8px 12px; cursor:pointer; font-size:16px}
  .iconbtn:hover{border-color:var(--pink)}
  .tabs{display:flex; gap:10px; padding:18px 28px 0}
  .tab{background:var(--card); border:1px solid var(--line); color:var(--mut); border-radius:12px; padding:10px 20px; cursor:pointer; font-size:15px; font-weight:600}
  .tab.active{background:linear-gradient(135deg,#ff2d78,#c81e5b); color:#fff; border-color:transparent}
  .tab .n{background:rgba(255,255,255,.2); border-radius:20px; padding:1px 9px; font-size:12px; margin-left:6px}
  .searchrow{padding:18px 28px 0}
  .search{background:var(--card); border:1px solid var(--line); border-radius:14px; display:flex; align-items:center; gap:12px; padding:14px 18px}
  .search input{flex:1; background:transparent; border:none; outline:none; color:var(--txt); font-size:16px}
  .search input::placeholder{color:#5d5d72}
  .niches{display:flex; gap:10px; padding:16px 28px; overflow-x:auto; align-items:center}
  .niches .lbl{color:var(--mut); font-size:14px; white-space:nowrap; display:flex; align-items:center; gap:6px}
  .pill{background:var(--card); border:1px solid var(--line); color:var(--txt); border-radius:20px; padding:8px 16px; cursor:pointer; font-size:14px; white-space:nowrap}
  .pill .c{background:#2c2c3a; border-radius:12px; padding:0 8px; font-size:12px; margin-left:6px; color:var(--mut)}
  .pill.active{background:var(--cyan); color:#06232a; font-weight:700; border-color:transparent}
  .pill.active .c{background:rgba(0,0,0,.15); color:#06232a}
  .section{padding:6px 28px; display:flex; align-items:center; justify-content:space-between}
  .section h2{font-size:17px; display:flex; align-items:center; gap:8px}
  .section .sub{color:var(--mut); font-size:13px}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(430px,1fr)); gap:20px; padding:14px 28px 40px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; position:relative; overflow:hidden}
  .card::before{content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--cyan),var(--pink),var(--purple))}
  .card .top{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .handle{font-size:24px; font-weight:800; letter-spacing:-.5px}
  .nbadge{font-size:13px; padding:6px 14px; border-radius:16px; border:1px solid; font-weight:600}
  .copyrow{margin-top:12px}
  .copybtn{background:var(--card2); border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:7px 14px; cursor:pointer; font-size:13px; display:inline-flex; align-items:center; gap:6px}
  .copybtn:hover{border-color:var(--cyan)}
  .meta{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap}
  .metachip{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:9px 16px; font-size:14px; display:flex; align-items:center; gap:8px}
  .metachip .lab{color:var(--pink2); font-weight:700}
  .rewards{color:var(--cyan)}
  .notes{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-top:14px; font-size:14px; color:#d6d6e2; line-height:1.5}
  .btns{display:flex; gap:10px; margin-top:16px}
  .btn{flex:1; border-radius:12px; padding:12px; font-size:15px; font-weight:700; cursor:pointer; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; gap:8px; text-decoration:none}
  .btn-profile{background:linear-gradient(135deg,#ff2d78,#e01e63); color:#fff; border:none}
  .btn-video{background:var(--card2); color:var(--txt)}
  .btn-video:hover{border-color:var(--cyan)}
  .btn-video.off{opacity:.35; cursor:default}
  .btn-approve{background:linear-gradient(135deg,#22c55e,#15803d); color:#fff; border:none}
  .btn-reject{background:var(--card2); color:#f87171}
  .evidence{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
  .ev{background:#12202b; border:1px solid #1e3a4a; color:#a5e3f5; border-radius:10px; padding:6px 12px; font-size:12px}
  .score{position:absolute; top:14px; right:16px; background:linear-gradient(135deg,#a855f7,#6d28d9); color:#fff; font-size:12px; font-weight:800; border-radius:10px; padding:5px 11px}
  .empty{grid-column:1/-1; text-align:center; color:var(--mut); padding:60px 20px; font-size:16px}
  .addbtn{position:fixed; bottom:26px; right:26px; width:62px; height:62px; border-radius:50%; background:linear-gradient(135deg,#ff2d78,#c81e5b); border:none; color:#fff; font-size:30px; cursor:pointer; box-shadow:0 8px 24px rgba(255,45,120,.4)}
  .modal{display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:50; align-items:center; justify-content:center}
  .modal.open{display:flex}
  .mbox{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px; width:min(480px,92vw); max-height:92vh; overflow-y:auto}
  .mbox h3{margin-bottom:16px}
  .mbox label{display:block; font-size:13px; color:var(--mut); margin:12px 0 5px}
  .mbox input,.mbox select,.mbox textarea{width:100%; background:var(--card2); border:1px solid var(--line); border-radius:10px; color:var(--txt); padding:10px 12px; font-size:14px; outline:none}
  .mbox .row{display:flex; gap:10px; margin-top:20px}
  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:#1c1c28; border:1px solid var(--cyan); color:var(--txt); padding:12px 22px; border-radius:12px; display:none; z-index:99}
  .src{font-size:11px; color:var(--mut); margin-top:10px}
  .src.auto{color:var(--cyan)}
  .cr{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; border-radius:10px; padding:5px 12px; border:1px solid}
  .cr.low{color:#4ade80; border-color:#4ade80; background:rgba(74,222,128,.08)}
  .cr.medium{color:#facc15; border-color:#facc15; background:rgba(250,204,21,.08)}
  .cr.high{color:#f87171; border-color:#f87171; background:rgba(248,113,113,.08)}
  .topic-title{font-size:16px; font-weight:700; line-height:1.45; margin:12px 0 4px}
  .topic-src{font-size:12px; color:var(--mut); margin-bottom:10px}
  .crnote{font-size:12px; color:var(--mut); margin-top:8px; line-height:1.5}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="flame">🔥</div> Amir Malik viral niches</div>
  <div class="spacer"></div>
  <div class="chip">📅 <span id="date">—</span></div>
  <div class="chip">🔥 <b id="count">0</b></div>
  <div class="chip">🕐 <span id="clock">—</span></div>
  <button class="iconbtn" id="refreshBtn" title="Refresh">🔄</button>
  <button class="iconbtn" id="detectBtn" title="Run auto-detect">🤖</button>
</header>

<div class="tabs">
  <button class="tab" data-tab="accounts">📈 Viral Accounts <span class="n" id="nAcc">0</span></button>
  <button class="tab" data-tab="candidates">🤖 Candidates <span class="n" id="nCan">0</span></button>
  <button class="tab active" data-tab="topics">🌍 Viral Topics <span class="n" id="nTop">0</span></button>
</div>

<div class="niches" id="filterRow" style="display:none"><span class="lbl">⚙️ Filters:</span></div>
<div class="niches" id="countryRow" style="display:none"><span class="lbl">🌍 Country:</span></div>
<div class="niches" id="topicNicheRow" style="display:none"><span class="lbl">⧩ Niche:</span></div>

<div class="searchrow">
  <div class="search">🔍 <input id="q" placeholder="Search by handle, niche, or notes (e.g. @mindset, AI, RPM)..."></div>
</div>

<div class="niches" id="niches"><span class="lbl">⧩ Niche:</span></div>

<div class="section">
  <h2 id="sectTitle">📈 Viral Accounts (0)</h2>
  <div class="sub" id="sectSub">Latest Day Only</div>
</div>

<div class="grid" id="grid"></div>

<button class="addbtn" id="addBtn" title="Add account">＋</button>

<div class="modal" id="modal">
  <div class="mbox">
    <h3>Add Account</h3>
    <label>Handle (e.g. @policecampov1)</label><input id="f_handle">
    <label>Niche</label><input id="f_niche" list="nicheList" placeholder="e.g. Police bodycam compilations"><datalist id="nicheList"></datalist>
    <label>Followers (optional)</label><input id="f_followers" placeholder="e.g. 250K">
    <label>Notes</label><textarea id="f_notes" rows="2" placeholder="e.g. 2:02, 1.2M likes, 19.9K comments — massively viral"></textarea>
    <label>Video 1 URL (optional)</label><input id="f_v1">
    <label>Video 2 URL (optional)</label><input id="f_v2">
    <label>Days to monetize (e.g. 21) — account se criteria tak kitne din lage</label><input id="f_days" type="number" min="1" placeholder="e.g. 21">
    <label><input type="checkbox" id="f_ver" style="width:auto"> ✓ Blue tick (verified) account hai</label>
    <label><input type="checkbox" id="f_rew" checked style="width:auto"> Rewards Eligible</label>
    <div class="row">
      <button class="btn btn-profile" id="saveBtn">Save</button>
      <button class="btn btn-video" id="cancelBtn">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
let accounts=[], candidates=[], tab='topics', nicheFilter='All', query='';
let fastOnly=true, noBlueTick=true;
let topics=[], topicCountry='DE', topicsCache={};
let topicNicheFilter='All';
const COUNTRIES=[['DE','🇩🇪 Germany'],['US','🇺🇸 USA'],['GB','🇬🇧 UK'],['PK','🇵🇰 Pakistan']];
const CR_LABEL={low:['🟢 Safe','low'],medium:['🟡 Careful','medium'],high:['🔴 Risky','high']};
const NICHE_COLORS={};
function nicheColor(n){
  if(!NICHE_COLORS[n]){
    const hues=[265,190,320,150,25,210,0,100];
    const h=hues[Object.keys(NICHE_COLORS).length%hues.length];
    NICHE_COLORS[n]=`hsl(${h},80%,65%)`;
  }
  return NICHE_COLORS[n];
}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200);}

const DB_KEY='vat_pages_v1';
function getDB(){try{const d=JSON.parse(localStorage.getItem(DB_KEY));if(d&&d.accounts)return d;}catch(e){}return null;}
function saveDB(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB));}catch(e){}}
let DB=null;
async function ensureDB(){
  if(DB)return;
  let sa=[],sc=[];
  try{sa=await fetch('data/accounts.json').then(r=>r.json());}catch(e){}
  try{sc=await fetch('data/candidates.json').then(r=>r.json());}catch(e){}
  DB=getDB()||{accounts:sa,candidates:sc};
}
async function api(p,o){
  await ensureDB();
  const method=(o&&o.method)||'GET';
  const body=o&&o.body?JSON.parse(o.body):{};
  if(p==='/api/data')return{accounts:DB.accounts,candidates:DB.candidates};
  if(p.indexOf('/api/trends?country=')===0){
    const cc=p.split('=')[1];
    const r=await fetch('data/trends_'+cc+'.json');const d=await r.json();
    return{ok:true,cached:true,date:d.date,country:{},topics:d.topics||[],niches:d.niches||[]};
  }
  if(p==='/api/accounts'&&method==='POST'){
    const h=(body.handle||'').trim();if(!h)throw new Error('handle required');
    if(DB.accounts.some(a=>a.handle.toLowerCase()===h.toLowerCase()))throw new Error('ye handle pehle se hai');
    DB.accounts.unshift({handle:h,niche:body.niche||'Other',followers:body.followers||null,rewards_eligible:!!body.rewards_eligible,days_to_monetized:(body.days_to_monetized==null?null:body.days_to_monetized),verified:!!body.verified,notes:body.notes||'',video1_url:body.video1_url||null,video2_url:body.video2_url||null,date_added:new Date().toISOString().slice(0,10),source:'manual'});
    saveDB();return{ok:true};
  }
  if(p==='/api/candidates/approve'&&method==='POST'){
    const h=(body.handle||'').toLowerCase();const i=DB.candidates.findIndex(c=>c.handle.toLowerCase()===h);
    if(i<0)throw new Error('not found');const c=DB.candidates.splice(i,1)[0];
    delete c.evidence;delete c.score;c.source='auto';
    if(!DB.accounts.some(a=>a.handle.toLowerCase()===h))DB.accounts.unshift(c);
    saveDB();return{ok:true};
  }
  if(p==='/api/candidates/reject'&&method==='POST'){
    const h=(body.handle||'').toLowerCase();
    DB.candidates=DB.candidates.filter(c=>c.handle.toLowerCase()!==h);
    saveDB();return{ok:true};
  }
  throw new Error('static site me available nahi: '+p);
}

function fmt(n){if(n==null)return '—';if(n>=1e6)return (n/1e6).toFixed(1)+'M';if(n>=1e3)return (n/1e3).toFixed(1)+'K';return ''+n;}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function load(){
  try{
    const d=await api('/api/data');
    accounts=d.accounts||[]; candidates=d.candidates||[];
  }catch(e){ toast('Server se data nahi mila'); }
  render();
}
function filteredAccounts(){
  return accounts.filter(a=>{
    if(nicheFilter!=='All'&&a.niche!==nicheFilter)return false;
    if(fastOnly&&(a.days_to_monetized==null||a.days_to_monetized>30))return false;
    if(noBlueTick&&a.verified)return false;
    if(query){const q=query.toLowerCase();const hay=(a.handle+' '+(a.niche||'')+' '+(a.notes||'')).toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
}
function renderFilters(){
  const box=$('filterRow');box.innerHTML='<span class="lbl">⚙️ Filters:</span>';
  [['fast','⚡ 30 din me monetize',fastOnly,'fastOnly'],
   ['blue','🚫 Blue tick nahi',noBlueTick,'noBlueTick']].forEach(([k,label,on,varName])=>{
    const b=document.createElement('button');
    b.className='pill'+(on?' active':'');
    b.textContent=label;
    b.onclick=()=>{if(varName==='fastOnly')fastOnly=!fastOnly;else noBlueTick=!noBlueTick;render();};
    box.appendChild(b);
  });
}
function renderNiches(){
  const box=$('niches');box.innerHTML='<span class="lbl">⧩ Niche:</span>';
  const niches=['All',...new Set(accounts.map(a=>a.niche).filter(Boolean))];
  niches.forEach(n=>{
    const c=n==='All'?accounts.length:accounts.filter(a=>a.niche===n).length;
    const b=document.createElement('button');
    b.className='pill'+(n===nicheFilter?' active':'');
    b.innerHTML=esc(n)+' <span class="c">'+c+'</span>';
    b.onclick=()=>{nicheFilter=n;render();};
    box.appendChild(b);
  });
  const dl=$('nicheList');dl.innerHTML='';
  niches.slice(1).forEach(n=>{const o=document.createElement('option');o.value=n;dl.appendChild(o);});
}
function renderCountries(){
  const box=$('countryRow');box.innerHTML='<span class="lbl">🌍 Country:</span>';
  COUNTRIES.forEach(([cc,label])=>{
    const b=document.createElement('button');
    b.className='pill'+(cc===topicCountry?' active':'');
    b.textContent=label;
    b.onclick=()=>{topicCountry=cc;topicNicheFilter='All';loadTopics();};
    box.appendChild(b);
  });
}
function renderTopicNiches(){
  const box=$('topicNicheRow');box.innerHTML='<span class="lbl">⧩ Niche:</span>';
  const niches=['All',...new Set(topics.map(t=>t.niche).filter(Boolean))];
  niches.forEach(n=>{
    const c=n==='All'?topics.length:topics.filter(t=>t.niche===n).length;
    const b=document.createElement('button');
    b.className='pill'+(n===topicNicheFilter?' active':'');
    b.textContent=n+' ('+c+')';
    b.onclick=()=>{topicNicheFilter=n;render();};
    box.appendChild(b);
  });
}
async function loadTopics(){
  renderCountries();
  const grid=$('grid');
  if(topicsCache[topicCountry]){
    topics=topicsCache[topicCountry];render();return;
  }
  grid.innerHTML=`<div class="empty">⏳ ${topicCountry} ke viral topics load ho rahe hain...</div>`;
  try{
    const d=await api('/api/trends?country='+topicCountry);
    topics=d.topics||[];topicsCache[topicCountry]=topics;
    if(!d.ok)toast(d.message||'Trends nahi mile');
  }catch(e){topics=[];toast('Trends fail: '+e.message);}
  render();
}
function topicCardHTML(t){
  const nc=nicheColor(t.niche||'Other');
  const [crTxt,crCls]=CR_LABEL[t.copyright]||CR_LABEL.medium;
  return `<div class="card">
    <div class="top"><div class="nbadge" style="color:${nc};border-color:${nc}">${esc(t.niche||'Other')}</div>
    <span class="cr ${crCls}" title="${esc(t.copyright_note||'')}">${crTxt}</span></div>
    <div class="topic-title">${esc(t.title)}</div>
    <div class="topic-src">📰 ${esc(t.source||'Google News')}</div>
    <div class="crnote">©️ ${esc(t.copyright_note||'')}</div>
    <div class="btns">${t.link?`<a class="btn btn-video" href="${esc(t.link)}" target="_blank">↗ Open Story</a>`:''}</div>
  </div>`;
}
function filteredTopics(){
  const q=query.toLowerCase();
  return topics.filter(t=>{
    if(topicNicheFilter!=='All'&&t.niche!==topicNicheFilter)return false;
    if(q&&(t.title+' '+(t.niche||'')).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function cardHTML(a,isCand){
  const nc=nicheColor(a.niche||'Other');
  const v1=a.video1_url?`<a class="btn btn-video" href="${esc(a.video1_url)}" target="_blank">▶ Video 1</a>`:`<span class="btn btn-video off">🎥 Video 1 —</span>`;
  const v2=a.video2_url?`<a class="btn btn-video" href="${esc(a.video2_url)}" target="_blank">🎥 Video 2</a>`:`<span class="btn btn-video off">🎥 Video 2 —</span>`;
  const h=(a.handle||'').replace(/^@/,'');
  const prof=`https://www.tiktok.com/@${encodeURIComponent(h)}`;
  let extra='';
  if(isCand){
    extra=`<div class="evidence">${(a.evidence||[]).map(e=>`<span class="ev">${esc(e)}</span>`).join('')}</div>
    <div class="btns"><button class="btn btn-approve" onclick="approve('${esc(a.handle)}')">✓ Approve</button><button class="btn btn-reject" onclick="reject('${esc(a.handle)}')">✕ Reject</button></div>`;
  }
  const src=a.source==='auto'?`<div class="src auto">🤖 auto-detected ${esc(a.date_added||'')}</div>`:`<div class="src">added ${esc(a.date_added||'')}</div>`;
  return `<div class="card">${isCand?`<div class="score">★ ${a.score||0}</div>`:''}
    <div class="top"><div class="handle">${esc(a.handle.length>12?a.handle.slice(0,12)+'…':a.handle)}</div>
    <div class="nbadge" style="color:${nc};border-color:${nc}">${esc(a.niche||'Other')}</div></div>
    <div class="copyrow"><button class="copybtn" onclick="copyH('${esc(a.handle)}')">📋 Copy</button></div>
    <div class="meta">
      <div class="metachip">👥 <span class="lab">Followers:</span> ${esc(a.followers||'—')}</div>
      ${a.rewards_eligible?'<div class="metachip rewards">✨ Rewards Eligible</div>':''}
      ${a.days_to_monetized!=null?`<div class="metachip">⚡ <span class="lab">${a.days_to_monetized} din</span>&nbsp;me monetize</div>`:''}
      ${a.verified?'<div class="metachip">✓ Blue tick</div>':''}
    </div>
    ${a.notes?`<div class="notes">📝 ${esc(a.notes)}</div>`:''}
    <div class="btns">
      <a class="btn btn-profile" href="${prof}" target="_blank">↗ Profile</a>${v1}${v2}
    </div>${extra}${src}</div>`;
}
function render(){
  $('nAcc').textContent=accounts.length; $('nCan').textContent=candidates.length;
  $('nTop').textContent=topics.length;
  $('count').textContent=tab==='accounts'?accounts.length:(tab==='candidates'?candidates.length:topics.length);
  const isTopics=tab==='topics';
  const isAcc=tab==='accounts';
  $('niches').style.display=isAcc?'flex':'none';
  $('filterRow').style.display=isAcc?'flex':'none';
  $('countryRow').style.display=isTopics?'flex':'none';
  $('topicNicheRow').style.display=isTopics?'flex':'none';
  if(isAcc){renderNiches();renderFilters();}else if(!isTopics)renderNiches();else{renderCountries();renderTopicNiches();}
  const grid=$('grid');
  if(tab==='accounts'){
    $('sectTitle').innerHTML=`📈 Viral Accounts (${filteredAccounts().length})`;
    $('sectSub').textContent='Latest Day Only';
    const list=filteredAccounts();
    grid.innerHTML=list.length?list.map(a=>cardHTML(a,false)).join(''):`<div class="empty">Koi account filter par poora nahi utra.<br>＋ se add karte waqt "days to monetize" zaroor likho, ya ⚙️ filters off kar ke dekho.</div>`;
  }else if(tab==='candidates'){
    $('sectTitle').innerHTML=`🤖 Auto-detected Candidates (${candidates.length})`;
    $('sectSub').textContent='Review karke approve karo';
    grid.innerHTML=candidates.length?candidates.map(a=>cardHTML(a,true)).join(''):`<div class="empty">Abhi koi candidate nahi. 🤖 dabao taake trending data se detect ho.</div>`;
  }else{
    const cc=COUNTRIES.find(c=>c[0]===topicCountry);
    $('sectTitle').innerHTML=`🌍 Viral Topics — ${cc?cc[1]:topicCountry} (${filteredTopics().length})`;
    $('sectSub').textContent='Daily auto-refresh • niche filter • ©️ safety rating';
    const list=filteredTopics();
    grid.innerHTML=list.length?list.map(topicCardHTML).join(''):`<div class="empty">⏳ Loading...</div>`;
  }
}
window.copyH=h=>{navigator.clipboard.writeText(h);toast('Copied '+h);};
window.approve=async h=>{await api('/api/candidates/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({handle:h})});toast('Approved '+h);load();};
window.reject=async h=>{await api('/api/candidates/reject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({handle:h})});toast('Rejected');load();};

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');tab=t.dataset.tab;if(tab==='topics')loadTopics();else load();});
$('q').oninput=e=>{query=e.target.value;render();};
$('refreshBtn').onclick=()=>load();
$('detectBtn').onclick=()=>toast('🤖 Daily auto-refresh GitHub backend par chalta hai — roz subah fresh data');
$('addBtn').onclick=()=>$('modal').classList.add('open');
$('cancelBtn').onclick=()=>$('modal').classList.remove('open');
$('saveBtn').onclick=async()=>{
  const h=$('f_handle').value.trim();if(!h){toast('Handle likho');return;}
  const daysRaw=parseInt($('f_days').value,10);
  try{
    await api('/api/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      handle:h.startsWith('@')?h:'@'+h, niche:$('f_niche').value.trim()||'Other',
      followers:$('f_followers').value.trim()||null, notes:$('f_notes').value.trim(),
      video1_url:$('f_v1').value.trim()||null, video2_url:$('f_v2').value.trim()||null,
      days_to_monetized:isNaN(daysRaw)?null:daysRaw, verified:$('f_ver').checked,
      rewards_eligible:$('f_rew').checked})});
  }catch(e){toast('Save nahi hua: '+e.message);return;}
  $('modal').classList.remove('open');
  ['f_handle','f_niche','f_followers','f_notes','f_v1','f_v2','f_days'].forEach(i=>$(i).value='');
  $('f_ver').checked=false;
  toast('Account add ho gaya');load();
};
function tick(){const d=new Date();$('date').textContent=d.toISOString().slice(0,10);$('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
tick();setInterval(tick,30000);if(tab==='topics')loadTopics();else load();
</script>
</body>
</html>
